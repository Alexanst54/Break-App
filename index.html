<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pause conseillers</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;max-width:1000px;margin:auto;padding:25px;background:#f4f6f5;color:#202a28}
.card{background:white;border:1px solid #d9dfdc;border-radius:10px;padding:20px;margin:15px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{padding:10px;border:1px solid #ccd5d1;border-radius:6px}
button{padding:10px 15px;border:0;border-radius:6px;cursor:pointer;font-weight:bold}
.primary{background:#2f6f63;color:white}.secondary{background:#e8eeeb}.danger{background:#a8453f;color:white}
.columns{display:grid;grid-template-columns:1fr 1fr;gap:15px}
li{list-style:none;padding:10px 0;border-bottom:1px solid #ddd;display:flex;justify-content:space-between}
ul{padding:0}.muted{color:#68736f;font-size:13px}.success{color:#2f6f63}.error{color:#a8453f}
#admin{display:none}
@media(max-width:700px){.columns{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>Pause conseillers</h1>
<p class="muted" id="subtitle">Connexion…</p>

<div class="card">
<h2>Mon espace</h2>
<div class="row">
<input id="name" maxlength="30" placeholder="Votre prénom">
<button class="primary" id="action">Demander une pause</button>
</div>
<p id="status"></p>
<p id="connection" class="muted"></p>
<button class="secondary" id="openAdmin">Administration</button>
</div>

<div class="columns">
<div class="card"><h2>En pause (<span id="count">0</span>)</h2><ul id="breaks"></ul></div>
<div class="card"><h2>File d'attente</h2><ul id="queue"></ul></div>
</div>

<section id="admin">
<div class="card" id="loginCard">
<h2>Administration</h2>
<p class="muted">Connexion avec le compte créé dans Supabase Authentication.</p>
<div class="row">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Mot de passe">
<button class="primary" id="login">Se connecter</button>
<button class="secondary" id="closeAdmin">Fermer</button>
</div>
<p id="loginStatus"></p>
</div>

<div id="dashboard" style="display:none">
<div class="card">
<h2>Paramètres</h2>
<div class="row">
<label>Places : <input type="number" id="max" min="1" max="100"></label>
<label>Durée (min) : <input type="number" id="minutes" min="1" max="180"></label>
<button class="primary" id="save">Enregistrer</button>
<button class="secondary" id="logout">Déconnexion</button>
</div>
<p id="settingsStatus"></p>
</div>

<div class="columns">
<div class="card"><h2>Pauses</h2><ul id="adminBreaks"></ul></div>
<div class="card"><h2>File</h2><ul id="adminQueue"></ul></div>
</div>

<div class="card">
<button class="danger" id="clearQueue">Vider la file</button>
<button class="danger" id="reset">Réinitialiser tout</button>
</div>
</div>
</section>

<script>
const SUPABASE_URL='https://ferxlbwivyyfhnwgmcja.supabase.co';
const SUPABASE_KEY='sb_publishable_8hUQ_GkKsTl09DTe4bLH-Q_ZHEPHRXE';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let state={activeBreaks:[],queue:[],settings:{maxBreaks:7,breakMinutes:15}};
let name=localStorage.getItem('pause_name')||'',admin=false;
const $=id=>document.getElementById(id);
$('name').value=name;

function esc(v){const d=document.createElement('div');d.textContent=v||'';return d.innerHTML}
function norm(x){return {activeBreaks:x?.activeBreaks||[],queue:x?.queue||[],settings:{maxBreaks:+(x?.settings?.maxBreaks||7),breakMinutes:+(x?.settings?.breakMinutes||15)}}}
function timeLeft(start){return Math.max(0,state.settings.breakMinutes*60000-(Date.now()-new Date(start).getTime()))}
function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);return m+':'+String(s%60).padStart(2,'0')}

async function getState(){let r=await db.rpc('get_pause_state');if(r.error)throw r.error;return norm(r.data)}
function render(){
$('count').textContent=state.activeBreaks.length;
$('subtitle').textContent=state.settings.maxBreaks+' places simultanées · '+state.settings.breakMinutes+' min';
$('breaks').innerHTML=state.activeBreaks.length?'':'<li class="muted">Personne en pause.</li>';
state.activeBreaks.forEach(x=>$('breaks').insertAdjacentHTML('beforeend','<li><b>'+esc(x.name)+'</b><span>'+fmt(timeLeft(x.startTime))+'</span></li>'));
$('queue').innerHTML=state.queue.length?'':'<li class="muted">Aucune demande.</li>';
state.queue.forEach((x,i)=>$('queue').insertAdjacentHTML('beforeend','<li><span><b>'+(i+1)+'.</b> '+esc(x.name)+'</span></li>'));
let b=state.activeBreaks.some(x=>x.name.toLowerCase()===name.toLowerCase()),q=state.queue.some(x=>x.name.toLowerCase()===name.toLowerCase());
$('action').disabled=!name;
$('action').textContent=b?'Je suis de retour':q?'Annuler ma demande':'Demander une pause';
$('status').textContent=b?'Vous êtes en pause · '+fmt(timeLeft(state.activeBreaks.find(x=>x.name.toLowerCase()===name.toLowerCase()).startTime))+' restantes':q?'Vous êtes dans la file.':'';
}
async function refresh(){
try{state=await getState();$('connection').textContent='Connecté · '+new Date().toLocaleTimeString('fr-FR');$('connection').className='success';render();if(admin)adminRefresh()}catch(e){$('connection').textContent='Erreur Supabase : '+(e?.message||String(e));$('connection').className='error';console.error('Supabase get_pause_state error:',e)}
}
$('name').oninput=()=>{name=$('name').value.trim().replace(/\s+/g,' ');localStorage.setItem('pause_name',name);render()};
$('action').onclick=async()=>{try{
let b=state.activeBreaks.some(x=>x.name.toLowerCase()===name.toLowerCase()),q=state.queue.some(x=>x.name.toLowerCase()===name.toLowerCase());
let r=await db.rpc(b||q?'cancel_or_return':'request_pause',{p_name:name});if(r.error)throw r.error;state=norm(r.data);render();
}catch(e){alert(e.message)}};

$('openAdmin').onclick=()=>{$('admin').style.display='block';$('admin').scrollIntoView({behavior:'smooth'})};
$('closeAdmin').onclick=()=>{$('admin').style.display='none'};

async function login(){
try{let r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;
let a=await db.rpc('is_admin');if(a.error)throw a.error;if(!a.data){await db.auth.signOut();throw Error('Ce compte n’est pas administrateur.')}
admin=true;$('loginCard').style.display='none';$('dashboard').style.display='block';await adminRefresh()
}catch(e){$('loginStatus').textContent=e.message;$('loginStatus').className='error'}
}
$('login').onclick=login;
$('logout').onclick=async()=>{await db.auth.signOut();admin=false;$('dashboard').style.display='none';$('loginCard').style.display='block'};

async function adminRefresh(){
let r=await db.rpc('admin_get_state');if(r.error)return;
let s=norm(r.data);$('max').value=s.settings.maxBreaks;$('minutes').value=s.settings.breakMinutes;
$('adminBreaks').innerHTML=s.activeBreaks.length?'':'<li class="muted">Personne en pause.</li>';
s.activeBreaks.forEach(x=>$('adminBreaks').insertAdjacentHTML('beforeend','<li><b>'+esc(x.name)+'</b><button class="danger" onclick="removePerson('+JSON.stringify(x.name)+',\'break\')">Retour</button></li>'));
$('adminQueue').innerHTML=s.queue.length?'':'<li class="muted">Aucune demande.</li>';
s.queue.forEach(x=>$('adminQueue').insertAdjacentHTML('beforeend','<li><b>'+esc(x.name)+'</b><button class="danger" onclick="removePerson('+JSON.stringify(x.name)+',\'queue\')">Supprimer</button></li>'));
}
window.removePerson=async(n,m)=>{if(!confirm('Confirmer ?'))return;let r=await db.rpc('admin_remove_person',{p_name:n,p_mode:m});if(r.error)alert(r.error.message);else{state=norm(r.data);render();adminRefresh()}};
$('save').onclick=async()=>{let r=await db.rpc('admin_update_settings',{p_max_breaks:+$('max').value,p_break_minutes:+$('minutes').value});if(r.error)alert(r.error.message);else{state=norm(r.data);render();adminRefresh();$('settingsStatus').textContent='Paramètres enregistrés.'}};
$('clearQueue').onclick=async()=>{if(!confirm('Vider la file ?'))return;let r=await db.rpc('admin_clear_queue');if(r.error)alert(r.error.message);else{state=norm(r.data);render();adminRefresh()}};
$('reset').onclick=async()=>{if(!confirm('Réinitialiser toutes les pauses et demandes ?'))return;let r=await db.rpc('admin_reset_all');if(r.error)alert(r.error.message);else{state=norm(r.data);render();adminRefresh()}};

(async()=>{await refresh();setInterval(refresh,10000);setInterval(render,1000)})();
</script>
</body>
</html>
