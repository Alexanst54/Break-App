name: Preproduction checks (no deployment)
on:
  push:
    branches: ['preprod/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: break-app-preprod-static
          path: dist/
